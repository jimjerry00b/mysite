name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------------------------------------------------------------------------
  # CI: runs on every push and pull request. Must pass before deploy.
  # ---------------------------------------------------------------------------
  test:
    name: CI - Tests & Checks
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-dummy-key-not-used-in-production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --verbosity 2

  # ---------------------------------------------------------------------------
  # CD: only runs on a direct push to main, and only if CI passed.
  # ---------------------------------------------------------------------------
  deploy:
    name: CD - Deploy to VPS
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            cd /var/www/mysite
            git pull --ff-only origin main
            venv/bin/pip install --upgrade pip
            venv/bin/pip install -r requirements.txt
            set -a; [ -f .env ] && . ./.env; set +a
            venv/bin/python manage.py migrate --noinput
            venv/bin/python manage.py collectstatic --noinput
            systemctl restart gunicorn
            systemctl is-active gunicorn
